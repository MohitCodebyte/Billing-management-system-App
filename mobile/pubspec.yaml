name: mobile
description: "BharatLedger Pro - Industrial Billing & ERP Mobile Application"
publish_to: 'none'
version: 4.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3
  uuid: ^4.4.0
  provider: ^6.1.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
